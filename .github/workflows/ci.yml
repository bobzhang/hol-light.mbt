# As upstream HOL Light's CI, which builds the system and loads hol.ml: the
# core tier (the hand-ported core on wasm and wasm-gc, every file hol.ml
# loads on wasm-gc). The theory directories are hours of CPU and are not
# run here: `python3 tools/test.py all` by hand, as upstream's holtest.
name: CI

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  core:
    name: core tier (wasm, wasm-gc)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        moonbit: [latest, pre-release]
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: moon version --all

      # type-checks every package and test of the repository with the selected
      # toolchain (no linking, so it is cheap): the tiers below only build
      # the core, and the rest is otherwise compiled only by full.yml
      - name: Check every package
        run: moon check -j 4

      - name: Core tier
        run: |
          python3 tools/test_hol_notation.py
          python3 tools/test_runner_test.py
          python3 tools/test.py core --build-jobs 4 -j 4
